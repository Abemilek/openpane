# Build memory allocation.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Disable resident Gradle daemons so each build exits cleanly.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- GeckoView version (single source of truth) ----
# Update this regularly before production use.
geckoviewVersion=150.0.20260511200624

# ---- ABIs included in the APK ----
# arm64-v8a targets current phones; ARMv7 can be selected for older phones.
abis=arm64-v8a
